# Project-wide Gradle settings.

# JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
# Pinned to KSP1 mode: Hilt 2.52 raced against KSP2's annotation-value handling and
# emitted "[Hilt] Expected @AndroidEntryPoint to have a value" during processing.
# Re-enable (set true) once Hilt is bumped to 2.55+ which is KSP2-aware.
ksp.useKSP2=false
